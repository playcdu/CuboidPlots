plugins { id 'fabric-loom' version '1.10.5' }
base { archivesName = "cuboidplots-${rootProject.minecraft_version}-fabric" }
repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation('dev.ftb.mods:ftb-chunks-fabric:2001.3.8') { transitive = false }
    modImplementation('dev.ftb.mods:ftb-teams-fabric:2001.3.2') { transitive = false }
    modImplementation('dev.ftb.mods:ftb-library-fabric:2001.2.13') { transitive = false }
    modImplementation('dev.ftb.mods:ftb-ranks-fabric:2001.1.7') { transitive = false }
    modImplementation('dev.architectury:architectury-fabric:9.2.14') { transitive = false }
    modImplementation('me.shedaniel.cloth:cloth-config-fabric:11.1.136') { transitive = false }
    modImplementation('maven.modrinth:open-parties-and-claims:fabric-1.20.1-0.30.3') { transitive = false }
    implementation project(':core')
    include project(':core')
    include(implementation('io.github.llamalad7:mixinextras-fabric:0.4.1'))
}
sourceSets.main.java.srcDir '../platform/src/main/java'
sourceSets.main.resources.srcDir '../platform/src/main/resources'
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
if (project.hasProperty('testHost')) { sourceSets.main.java.srcDir '../testhost/src/main/java'; base.archivesName = "cuboidplots-${rootProject.minecraft_version}-fabric-testhost" }
processResources {
    inputs.property 'version', project.version
    inputs.property 'testHost', project.hasProperty('testHost')
    filesMatching('fabric.mod.json') { expand(version: project.version, test_entrypoint: project.hasProperty('testHost') ? ', "dev.cuboidplots.testhost.ServerAcceptance"' : '') }
}
