plugins { id 'fabric-loom' version '1.10.5' }
base { archivesName = "cuboidplots-${rootProject.minecraft_version}-fabric" }
repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation('dev.ftb.mods:ftb-chunks-fabric:1802.3.19-build.362') { transitive = false }
    modImplementation('dev.ftb.mods:ftb-teams-fabric:1802.2.11-build.152') { transitive = false }
    modImplementation('dev.ftb.mods:ftb-library-fabric:1802.3.12-build.726') { transitive = false }
    modImplementation('dev.ftb.mods:ftb-ranks-fabric:1802.1.11-build.71') { transitive = false }
    modImplementation('dev.architectury:architectury-fabric:4.12.94') { transitive = false }
    modImplementation('me.shedaniel.cloth:cloth-config-fabric:6.5.116') { transitive = false }
    modImplementation('maven.modrinth:open-parties-and-claims:fabric-1.18.2-0.30.3') { transitive = false }
    implementation project(':core')
    include project(':core')
    include(implementation('io.github.llamalad7:mixinextras-fabric:0.4.1'))
}
sourceSets.main.java.srcDir '../platform/src/main/java'
sourceSets.main.resources.srcDir '../platform/src/main/resources'
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
if (project.hasProperty('testHost')) { sourceSets.main.java.srcDir '../testhost/src/main/java'; base.archivesName = "cuboidplots-${rootProject.minecraft_version}-fabric-testhost" }
processResources {
    inputs.property 'version', project.version
    inputs.property 'testHost', project.hasProperty('testHost')
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    doLast {
        if (project.hasProperty('testHost')) {
            def metadataFile = file("$destinationDir/fabric.mod.json")
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.entrypoints.main.add('dev.cuboidplots.testhost.FabricAcceptance')
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
            def mixinFile=file("$destinationDir/cuboidplots.mixins.json")
            def mixinConfig=new groovy.json.JsonSlurper().parse(mixinFile)
            mixinConfig.mixins.add('integration.FtbTransferAccess')
            mixinFile.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mixinConfig))
        }
    }
}
