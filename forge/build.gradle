plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.47'
    id 'org.spongepowered.mixin' version '0.7.38'
}
group = 'dev.cuboidplots'
version = '0.1.0'
base { archivesName = 'cuboidplots-1.18.2-forge' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
minecraft { mappings channel: 'official', version: '1.18.2' }
mixin { add sourceSets.main, 'cuboidplots.refmap.json'; config 'cuboidplots.mixins.json' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.12'
    implementation fg.deobf('dev.ftb.mods:ftb-chunks-forge:1802.3.19-build.362') { transitive = false }
    implementation fg.deobf('dev.ftb.mods:ftb-teams-forge:1802.2.11-build.152') { transitive = false }
    implementation fg.deobf('dev.ftb.mods:ftb-library-forge:1802.3.12-build.726') { transitive = false }
    implementation fg.deobf('dev.ftb.mods:ftb-ranks-forge:1802.1.11-build.71') { transitive = false }
    implementation fg.deobf('dev.architectury:architectury-forge:4.12.94') { transitive = false }
    implementation fg.deobf('maven.modrinth:open-parties-and-claims:forge-1.18.2-0.30.3') { transitive = false }
    implementation 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '[0.4.1,0.5)') { jarJar.pin(it, '0.4.1') }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}
sourceSets { portableCore { java.srcDir '../core/src/main/java' } }
sourceSets.main.java.srcDir '../platform/src/main/java'
sourceSets.main.compileClasspath += sourceSets.portableCore.output
sourceSets.main.runtimeClasspath += sourceSets.portableCore.output
sourceSets.main.resources.srcDir '../platform/src/main/resources'
if (project.hasProperty('testHost')) {
    sourceSets.main.java.srcDirs += ['../testhost/src/main/java', 'src/testHost/java']
    sourceSets.main.java.exclude '**/FabricAcceptance.java'
    base.archivesName = 'cuboidplots-1.18.2-forge-testhost'
}
jarJar.enable()
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8'; options.incremental = false }
tasks.named('compilePortableCoreJava', JavaCompile).configure { options.release = 8 }
tasks.named('jar', Jar).configure {
    from sourceSets.portableCore.output
    manifest { attributes(['MixinConfigs':'cuboidplots.mixins.json']) }
    finalizedBy 'reobfJar'
}
tasks.named('jarJar', Jar).configure { from sourceSets.portableCore.output; manifest { attributes(['MixinConfigs':'cuboidplots.mixins.json']) } }
reobf { jarJar {} }
tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }
processResources {
    doLast {
        def configFile = file("$destinationDir/cuboidplots.mixins.json")
        def config = new groovy.json.JsonSlurper().parse(configFile)
        config.refmap = 'cuboidplots.refmap.json'
        if (project.hasProperty('testHost')) config.mixins.add('integration.FtbTransferAccess')
        configFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}
